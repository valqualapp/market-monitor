name: Actualizar Market Monitor

on:
  schedule:
    # Cada sábado a las 08:00 UTC (10:00 en Madrid en verano, 09:00 en invierno),
    # con el cierre del viernes ya publicado.
    - cron: "0 8 * * 6"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos de FRED y regenerar market.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # opcional; si no existe se usa el CSV público
        run: python scripts/update_data.py

      - name: Descargar datos de Europa (BCE) y regenerar europe.json
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_europe.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "valqual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos semanales $(date -u +%Y-%m-%d)"
            git push
          fi

      # --- OPCIONAL: publicar en Firebase Hosting en lugar de GitHub Pages ---
      # 1) En Firebase: crear una cuenta de servicio y guardarla como secreto
      #    FIREBASE_SERVICE_ACCOUNT en GitHub (Settings > Secrets > Actions).
      # 2) Quitar el símbolo # de las líneas siguientes y poner tu projectId.
      # - uses: FirebaseExtended/action-hosting-deploy@v0
      #   with:
      #     repoToken: ${{ secrets.GITHUB_TOKEN }}
      #     firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      #     projectId: TU-PROYECTO-FIREBASE
      #     channelId: live
